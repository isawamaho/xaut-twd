<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XAUT 持倉估值</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --muted:#6b675e; --gold:#b8892d; --line:#e4dfd3; --err:#b3261e; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16150f; --card:#201f18; --ink:#f1ede3; --muted:#a29c8e; --gold:#d9ab4f; --line:#36342a; --err:#f2b8b5; --warn:#f0c674; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .price { font-size: 14px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .price-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .btn2 { padding: 6px 12px; font-size: 13px; background: transparent; color: var(--gold); border: 1px solid var(--gold); white-space: nowrap; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .status:empty { display: none; }
  .token { display: none; margin-top: 10px; font-size: 13px; }
  .token p { margin: 0 0 6px; color: var(--muted); line-height: 1.6; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 12px; font-weight: 400; cursor: pointer; }
  .price b { color: var(--gold); font-variant-numeric: tabular-nums; }
  .price small { color: var(--muted); }
  .warn { color: var(--warn); }
  label { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; margin-top: 6px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: 14px ui-monospace, monospace; background: transparent; color: var(--ink); }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--gold); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .result { margin-top: 20px; display: none; }
  .big { font-size: 32px; font-weight: 700; color: var(--gold); margin: 4px 0 16px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; word-break: break-all; }
  .err { color: var(--err); margin-top: 14px; font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>XAUT 持倉 NT$ 估值</h1>
  <p class="sub">以太坊地址上的 Tether Gold，以 MaiCoin Sell Price 計算</p>
  <div class="card">
    <div class="price">
      <div class="price-head">
        <div id="priceBox">讀取價格中…</div>
        <button class="btn2" id="refresh">更新價格</button>
      </div>
      <div class="status" id="status"></div>
      <div class="token" id="tokenBox">
        <p>更新價格需要 GitHub 權杖（只需 xaut-twd 的 Actions 讀寫權限）。權杖只存在這台裝置的瀏覽器，不會上傳到網站。</p>
        <div class="row">
          <input id="tokenInput" type="password" placeholder="github_pat_..." autocomplete="off">
          <button id="tokenSave">儲存並更新</button>
        </div>
      </div>
      <div style="margin-top:6px"><button class="link" id="tokenClear" hidden>清除已儲存的權杖</button></div>
    </div>
    <label for="addr">以太坊地址</label>
    <div class="row">
      <input id="addr" placeholder="0x..." autocomplete="off" spellcheck="false">
      <button id="go">查詢</button>
    </div>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <div style="color:var(--muted);font-size:13px">估計現值</div>
      <div class="big" id="value"></div>
      <dl>
        <dt>XAUT 數量</dt><dd id="qty"></dd>
        <dt>MaiCoin Sell Price</dt><dd id="price"></dd>
        <dt>價格時間</dt><dd id="when"></dd>
      </dl>
    </div>
    <p class="note">價格每隔數分鐘由伺服器自動更新，非即時報價。僅計算以太坊主網上的 XAUT，不含其他鏈或交易所內的持有量。估值僅供參考。</p>
  </div>
</main>
<script>
  const RPC_URLS = ['https://ethereum-rpc.publicnode.com'];   // 可再加入其他 RPC 作為備援
  const XAUT = '0x68749665FF8D2d112Fa859AA293F07A622782F38';
  const STALE_MIN = 999;  // 價格超過幾分鐘視為過舊，暫停計算
  const REPO = 'isawamaho/xaut-twd', WORKFLOW = 'update-price.yml', BRANCH = 'main';
  const TOKEN_KEY = 'xaut_gh_token';
  const store = {
    get() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; } },
    set(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch {} },
    clear() { try { localStorage.removeItem(TOKEN_KEY); } catch {} },
  };

  const $ = id => document.getElementById(id);
  const fmt = (n, d) => Number(n).toLocaleString('zh-TW', { maximumFractionDigits: d });
  let priceData = null, decimals = null;

  async function loadPrice() {
    try {
      const r = await fetch('price.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error();
      priceData = await r.json();
      const ageMin = (Date.now() / 1000 - priceData.fetched_at) / 60;
      const t = new Date(priceData.fetched_at * 1000).toLocaleString('zh-TW', { hour12: false });
      $('priceBox').innerHTML = `MaiCoin Sell Price：<b>NT$ ${fmt(priceData.sell_price_twd, 2)}</b> `
        + `<small>（${t}，${Math.round(ageMin)} 分鐘前）</small>`
        + (ageMin > STALE_MIN ? `<div class="warn">價格已超過 ${STALE_MIN} 分鐘未更新，請按「更新價格」</div>` : '');
    } catch {
      priceData = null;
      $('priceBox').innerHTML = '<span class="warn">無法取得價格資料</span>';
    }
  }

  async function ethCall(data) {
    let lastErr;
    for (const url of RPC_URLS) {
      try {
        const r = await fetch(url, {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: XAUT, data }, 'latest'] })
        });
        const j = await r.json();
        if (j.error) throw new Error(j.error.message);
        return BigInt(j.result);
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  // 將 BigInt 原始值依小數位轉成字串，避免浮點誤差
  function toDecimalString(raw, dec) {
    const s = raw.toString().padStart(dec + 1, '0');
    const int = s.slice(0, -dec) || '0', frac = s.slice(-dec).replace(/0+$/, '');
    return frac ? `${int}.${frac}` : int;
  }

  async function run() {
    const address = $('addr').value.trim();
    $('err').textContent = ''; $('result').style.display = 'none';
    if (!/^0x[0-9a-fA-F]{40}$/.test(address)) { $('err').textContent = '地址格式錯誤，需為 0x 開頭的 40 位十六進位字串'; return; }
    $('go').disabled = true;
    try {
      await loadPrice();
      if (!priceData) throw new Error('目前無法取得價格，請稍後再試');
      if ((Date.now() / 1000 - priceData.fetched_at) / 60 > STALE_MIN) throw new Error('價格資料過舊，暫停計算');
      if (decimals === null) decimals = Number(await ethCall('0x313ce567'));
      const raw = await ethCall('0x70a08231' + address.slice(2).toLowerCase().padStart(64, '0'));
      const qty = toDecimalString(raw, decimals);
      const value = Number(qty) * Number(priceData.sell_price_twd);
      $('value').textContent = 'NT$ ' + fmt(value, 0);
      $('qty').textContent = fmt(qty, 6) + ' XAUT';
      $('price').textContent = 'NT$ ' + fmt(priceData.sell_price_twd, 2);
      $('when').textContent = new Date(priceData.fetched_at * 1000).toLocaleString('zh-TW', { hour12: false });
      $('result').style.display = 'block';
    } catch (e) {
      $('err').textContent = e.message || '查詢鏈上餘額失敗，請稍後再試';
    } finally {
      $('go').disabled = false;
    }
  }

  // ---------- 手動更新價格：觸發 GitHub Actions ----------
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const setStatus = t => { $('status').textContent = t; };
  const syncTokenUI = () => { $('tokenClear').hidden = !store.get(); };

  async function triggerWorkflow(token) {
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ ref: BRANCH }),
    });
    return r.status;   // 成功為 204
  }

  async function refreshPrice() {
    const token = store.get();
    if (!token) { $('tokenBox').style.display = 'block'; $('tokenInput').focus(); return; }

    const before = priceData?.fetched_at || 0;
    $('refresh').disabled = true;
    try {
      setStatus('正在觸發更新…');
      let status;
      try { status = await triggerWorkflow(token); }
      catch { setStatus('無法連線到 GitHub，請稍後再試'); return; }

      if (status === 401 || status === 403 || status === 404) {
        store.clear(); syncTokenUI();
        $('tokenBox').style.display = 'block';
        setStatus(`權杖無效或權限不足（${status}），請重新輸入`);
        return;
      }
      if (status !== 204) { setStatus(`觸發失敗（HTTP ${status}）`); return; }

      // 等待 Actions 跑完並部署（通常 1–2 分鐘），每 10 秒檢查一次 price.json
      const start = Date.now();
      while (Date.now() - start < 5 * 60 * 1000) {
        setStatus(`已觸發，等待新價格… ${Math.round((Date.now() - start) / 1000)} 秒`);
        await sleep(10000);
        await loadPrice();
        if (priceData && priceData.fetched_at > before) { setStatus('價格已更新'); return; }
      }
      setStatus('超過 5 分鐘仍未更新，請到 GitHub Actions 頁面查看執行狀況');
    } finally {
      $('refresh').disabled = false;
    }
  }

  $('refresh').onclick = refreshPrice;
  $('tokenSave').onclick = () => {
    const v = $('tokenInput').value.trim();
    if (!v) return;
    store.set(v); $('tokenInput').value = ''; $('tokenBox').style.display = 'none'; syncTokenUI();
    refreshPrice();
  };
  $('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('tokenSave').click(); });
  $('tokenClear').onclick = () => { store.clear(); syncTokenUI(); setStatus('已清除權杖'); };

  $('go').onclick = run;
  $('addr').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  syncTokenUI();
  loadPrice();
</script>
</body>
</html>
