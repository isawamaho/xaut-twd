<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XAUT 持倉估值</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --muted:#6b675e; --gold:#b8892d; --line:#e4dfd3; --err:#b3261e; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16150f; --card:#201f18; --ink:#f1ede3; --muted:#a29c8e; --gold:#d9ab4f; --line:#36342a; --err:#f2b8b5; --warn:#f0c674; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .price { font-size: 14px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .price-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .price b { color: var(--gold); font-variant-numeric: tabular-nums; }
  .price small { color: var(--muted); }
  .warn { color: var(--warn); }
  label { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; margin-top: 6px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: 14px ui-monospace, monospace; background: transparent; color: var(--ink); }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--gold); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .btn2 { padding: 6px 12px; font-size: 13px; background: transparent; color: var(--gold); border: 1px solid var(--gold); white-space: nowrap; }
  .result { margin-top: 20px; display: none; }
  .big { font-size: 32px; font-weight: 700; color: var(--gold); margin: 4px 0 16px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; word-break: break-all; }
  .depth { margin-top: 14px; font-size: 13px; line-height: 1.6; }
  .depth:empty { display: none; }
  .err { color: var(--err); margin-top: 14px; font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>XAUT 持倉 NT$ 估值</h1>
  <p class="sub">以太坊地址上的 Tether Gold，以 MAX 交易所最高買價計算</p>
  <div class="card">
    <div class="price">
      <div class="price-head">
        <div id="priceBox">讀取價格中…</div>
        <button class="btn2" id="refresh">重新整理</button>
      </div>
    </div>
    <label for="addr">以太坊地址</label>
    <div class="row">
      <input id="addr" placeholder="0x..." autocomplete="off" spellcheck="false">
      <button id="go">查詢</button>
    </div>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <div style="color:var(--muted);font-size:13px">估計現值（以 MAX 最高買價）</div>
      <div class="big" id="value"></div>
      <dl>
        <dt>XAUT 數量</dt><dd id="qty"></dd>
        <dt>MAX 最高買價</dt><dd id="price"></dd>
        <dt>價格時間</dt><dd id="when"></dd>
      </dl>
      <div class="depth warn" id="depth"></div>
    </div>
    <p class="note">價格來自 MAX 交易所 XAUT/TWD 的最高買單，與 MaiCoin App 的「賣出價」不同。MAX 的 XAUT 交易量小，持有量超過最高買單的數量時，會另外列出依掛單逐筆賣出的估算。僅計算以太坊主網上的 XAUT，估值僅供參考。</p>
  </div>
</main>
<script>
  // 價格 Worker 網址(Cloudflare Worker 自訂網域)
  const PRICE_URL = 'https://api.ihctw.bid/price';

  const RPC_URLS = ['https://ethereum-rpc.publicnode.com'];
  const XAUT = '0x68749665FF8D2d112Fa859AA293F07A622782F38';

  const $ = id => document.getElementById(id);
  const fmt = (n, d) => Number(n).toLocaleString('zh-TW', { maximumFractionDigits: d });
  const timeStr = s => new Date(s * 1000).toLocaleString('zh-TW', { hour12: false });
  let priceData = null, decimals = null;

  async function loadPrice() {
    try {
      const r = await fetch(PRICE_URL, { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || '');
      priceData = j;
      $('priceBox').innerHTML = `MAX 最高買價：<b>NT$ ${fmt(j.buy, 0)}</b>`
        + ` <small>（可承接 ${fmt(j.buy_vol, 4)} XAUT，${timeStr(j.fetched_at)}）</small>`
        + (j.stale ? '<div class="warn">MAX 暫時無法連線，顯示的是稍早的價格</div>' : '');
    } catch {
      priceData = null;
      $('priceBox').innerHTML = '<span class="warn">無法取得價格資料</span>';
    }
  }

  async function ethCall(data) {
    let lastErr;
    for (const url of RPC_URLS) {
      try {
        const r = await fetch(url, {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: XAUT, data }, 'latest'] })
        });
        const j = await r.json();
        if (j.error) throw new Error(j.error.message);
        return BigInt(j.result);
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  function toDecimalString(raw, dec) {
    const s = raw.toString().padStart(dec + 1, '0');
    const int = s.slice(0, -dec) || '0', frac = s.slice(-dec).replace(/0+$/, '');
    return frac ? `${int}.${frac}` : int;
  }

  // 依買單由高到低逐筆賣出，算出實際可得金額與賣不掉的數量
  function sellIntoBids(qty, bids) {
    let left = qty, total = 0;
    for (const [p, v] of bids) {
      if (left <= 0) break;
      const take = Math.min(left, Number(v));
      total += take * Number(p);
      left -= take;
    }
    return { total, unfilled: left > 1e-9 ? left : 0 };
  }

  async function run() {
    const address = $('addr').value.trim();
    $('err').textContent = ''; $('result').style.display = 'none'; $('depth').textContent = '';
    if (!/^0x[0-9a-fA-F]{40}$/.test(address)) { $('err').textContent = '地址格式錯誤，需為 0x 開頭的 40 位十六進位字串'; return; }
    $('go').disabled = true;
    try {
      await loadPrice();
      if (!priceData) throw new Error('目前無法取得價格，請稍後再試');
      if (decimals === null) decimals = Number(await ethCall('0x313ce567'));
      const raw = await ethCall('0x70a08231' + address.slice(2).toLowerCase().padStart(64, '0'));
      const qty = Number(toDecimalString(raw, decimals));
      const buy = Number(priceData.buy);

      $('value').textContent = 'NT$ ' + fmt(qty * buy, 0);
      $('qty').textContent = fmt(qty, 6) + ' XAUT';
      $('price').textContent = 'NT$ ' + fmt(buy, 0);
      $('when').textContent = timeStr(priceData.fetched_at);

      if (qty > Number(priceData.buy_vol)) {
        const { total, unfilled } = sellIntoBids(qty, priceData.bids || []);
        let msg = `持有量超過最高買單的 ${fmt(priceData.buy_vol, 4)} XAUT。依目前掛單逐筆賣出，約可得 NT$ ${fmt(total, 0)}`;
        if (unfilled > 0) {
          const bids = priceData.bids || [];
          const depthQty = bids.reduce((s, [, v]) => s + Number(v), 0);
          msg += `；其中 ${fmt(unfilled, 6)} XAUT 超出目前取得的前 ${bids.length} 檔買單（合計約 ${fmt(depthQty, 4)} XAUT），未計入`;
        }
        $('depth').textContent = msg + '。';
      }
      $('result').style.display = 'block';
    } catch (e) {
      $('err').textContent = e.message || '查詢鏈上餘額失敗，請稍後再試';
    } finally {
      $('go').disabled = false;
    }
  }

  $('refresh').onclick = async () => { $('refresh').disabled = true; await loadPrice(); $('refresh').disabled = false; };
  $('go').onclick = run;
  $('addr').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  loadPrice();
</script>
</body>
</html>
